# two certificates, one key file: the second certificate carries its own key (Apache pairs by index and
# falls back to the certificate file). pqc-webconf must skip this vhost instead of breaking the pairing.
<VirtualHost *:4433>
    ServerName e.test
    SSLEngine on
    SSLCertificateFile    /etc/ssl/fixture/e.crt
    SSLCertificateKeyFile /etc/ssl/fixture/e.key
    SSLCertificateFile    /etc/ssl/fixture/e-rsa-combined.pem
</VirtualHost>
