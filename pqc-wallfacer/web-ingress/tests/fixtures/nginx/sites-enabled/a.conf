server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name a.test www.a.test;

    ssl_certificate     /etc/ssl/fixture/a.crt;
    ssl_certificate_key /etc/ssl/fixture/a.key;
    include /etc/nginx/snippets/options-ssl-nginx.conf;
    ssl_ecdh_curve X25519:prime256v1;   # classical groups pinned on purpose

    location / {
        return 200 "a\n";
    }
}
