server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name d.test;
    ssl_certificate
        /etc/ssl/fixture/d.crt;
    ssl_certificate_key /etc/ssl/fixture/d.key;
    location / { return 200 "d\n"; }
}

server {
    listen 8081;
    server_name plain.test;
    location / { return 200 "plain\n"; }
}
